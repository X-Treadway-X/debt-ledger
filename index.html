let lang='ar',theme='light';
try{lang=localStorage.getItem(LKEY)==='en'?'en':'ar'}catch{}
try{const s=localStorage.getItem(TKEY);theme=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{}
const t=(k,v)=>{let s=I18N[lang][k]??k;if(v)for(const x in v)s=s.replace('{'+x+'}',v[x]);return s};
function applyTheme(){document.documentElement.dataset.theme=theme;document.querySelector('meta[name=theme-color]').content=theme==='dark'?'#4e241a':'#a6533d';$('themeBtn').textContent=theme==='dark'?'☀':'🌙';$('thLight').classList.toggle('on',theme==='light');$('thDark').classList.toggle('on',theme==='dark')}
function setTheme(x){theme=x;try{localStorage.setItem(TKEY,x)}catch{}applyTheme()}
function toggleTheme(){setTheme(theme==='dark'?'light':'dark')}
function applyStatic(){const h=document.documentElement;h.lang=lang;h.dir=lang==='ar'?'rtl':'ltr';document.title=t('pageTitle');
 document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
 document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
 $('date').textContent=new Date().toLocaleDateString(lang==='ar'?'ar':'en-US');$('langBtn').textContent=lang==='ar'?'EN':'عربي';$('cloudBtn').title=t('cloud_title');
 $('lgAr').classList.toggle('on',lang==='ar');$('lgEn').classList.toggle('on',lang==='en')}
function setLang(x){lang=x;try{localStorage.setItem(LKEY,x)}catch{}closeModal();applyStatic();render();renderSync(true)}
function toggleLang(){setLang(lang==='ar'?'en':'ar')}
/* ---------- data ---------- */
function updateAppHeight(){document.documentElement.style.setProperty('--app-height',(window.visualViewport?.height||window.innerHeight)+'px')}
updateAppHeight();window.addEventListener('resize',updateAppHeight);window.visualViewport?.addEventListener('resize',updateAppHeight);window.visualViewport?.addEventListener('scroll',updateAppHeight);
document.addEventListener('focusin',e=>{if(e.target.matches('input,select,textarea'))setTimeout(()=>e.target.scrollIntoView({block:'nearest',behavior:'smooth'}),180)});
const cents=n=>{const v=Number(n);return Number.isFinite(v)?Math.round((v+Number.EPSILON)*100):0};
const money=n=>cents(n)/100;
function sanitize(d){
 const people=(Array.isArray(d?.people)?d.people:[]).filter(p=>p&&p.id!=null&&String(p.name||'').trim()).map(p=>({...p,id:String(p.id),name:String(p.name).trim(),phone:String(p.phone||''),u:Number(p.u)||0}));
 const ids=new Set(people.map(p=>p.id));
 const tx=(Array.isArray(d?.tx)?d.tx:[]).filter(x=>x&&x.id!=null&&ids.has(String(x.person))&&['debt','payment'].includes(x.kind)&&cents(x.amount)>0).map(x=>({...x,id:String(x.id),person:String(x.person),amount:money(Math.abs(Number(x.amount))),currency:['USD','TRY','SYP'].includes(x.currency)?x.currency:'SYP',date:String(x.date||new Date().toISOString().slice(0,10)),u:Number(x.u)||0}));
 const del=(Array.isArray(d?.del)?d.del:[]).filter(x=>x&&x.id!=null).map(x=>({id:String(x.id),u:Number(x.u)||0}));
 return{people,tx,del};
}
let db;
try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch{db=null}
db=sanitize(db);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const persist=()=>localStorage.setItem(KEY,JSON.stringify(db));
const save=()=>{persist();scheduleAuto()};
const person=id=>db.people.find(p=>String(p.id)===String(id));
const txFor=id=>db.tx.filter(x=>String(x.person)===String(id));
const symbol=c=>c==='USD'?'$':c==='TRY'?'₺':t('sym_SYP');
const currencyOf=x=>['USD','TRY','SYP'].includes(x.currency)?x.currency:'SYP';
const balanceCents=(id,currency='SYP')=>txFor(id).filter(x=>currencyOf(x)===currency).reduce((s,x)=>s+(x.kind==='debt'?Math.abs(cents(x.amount)):(x.kind==='payment'?-Math.abs(cents(x.amount)):0)),0);
const totalCents=(k,currency='SYP')=>db.tx.filter(x=>(!k||x.kind===k)&&currencyOf(x)===currency).reduce((s,x)=>s+Math.abs(cents(x.amount)),0);
const total=(k,currency='SYP')=>totalCents(k,currency)/100;
const currenciesInUse=()=>['USD','TRY','SYP'].filter(c=>db.tx.some(x=>currencyOf(x)===c));
const fmt=(n,currency='SYP')=>new Intl.NumberFormat(lang==='ar'?'ar':'en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(money(n))+' '+symbol(currency);
const formatTotals=getter=>{const a=currenciesInUse().map(c=>fmt(getter(c),c));return a.length?a.join(' · '):fmt(0,'SYP')};
const balanceSummary=id=>['USD','TRY','SYP'].filter(c=>txFor(id).some(x=>currencyOf(x)===c)).map(c=>fmt(Math.max(0,balanceCents(id,c))/100,c)).join(' · ')||fmt(0,'SYP');
const hasBalance=id=>['USD','TRY','SYP'].some(c=>balanceCents(id,c)>0);
function toast(s){let e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2800)}
function go(id,btn){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));(btn||document.querySelector(`nav button[data-screen="${id}"]`))?.classList.add('active');window.scrollTo(0,0);render();if(id==='sync'){renderSync(true);if(cloudP()&&hist===null)loadHistory()}}
function item(x){let p=person(x.person);return `<div class="item"><div><strong>${x.kind==='debt'?t('debt_on'):t('pay_from')} ${esc(p?.name||t('customer'))}</strong><div class="muted">${esc(x.date)}${x.note?' · '+esc(x.note):''}</div></div><div class="amount" style="color:${x.kind==='debt'?'var(--red)':'var(--green)'}">${x.kind==='debt'?'+':'−'} ${fmt(x.amount,currencyOf(x))}</div></div>`}
function render(){
 $('sumDebt').textContent=formatTotals(c=>db.people.reduce((sum,p)=>sum+Math.max(0,balanceCents(p.id,c)),0)/100);$('sumCustomers').textContent=db.people.length.toLocaleString(lang==='ar'?'ar':'en-US');
 $('recent').innerHTML=db.tx.length?[...db.tx].reverse().map(item).join(''):`<div class="empty">${t('no_tx')}</div>`;
 renderCustomers();renderDebts();
 $('paymentList').innerHTML=db.tx.filter(x=>x.kind==='payment').reverse().map(item).join('')||`<div class="empty">${t('no_payments')}</div>`;
 $('historyList').innerHTML=[...db.tx].reverse().map(item).join('')||`<div class="empty">${t('history_empty')}</div>`;
 $('rDebt').textContent=formatTotals(c=>total('debt',c));$('rPaid').textContent=formatTotals(c=>total('payment',c));$('rBalance').textContent=formatTotals(c=>db.people.reduce((sum,p)=>sum+Math.max(0,balanceCents(p.id,c)),0)/100);
 $('reportPeople').innerHTML=db.people.map(p=>`<div class="item row-item"><div><strong>${esc(p.name)}</strong><div class="muted">${esc(p.phone||t('no_phone'))}</div></div><b>${balanceSummary(p.id)}</b></div>`).join('')||`<div class="empty">${t('no_customers')}</div>`;
}
function renderCustomers(){let q=($('customerSearch')?.value||'').toLowerCase();let a=db.people.filter(p=>(p.name+' '+p.phone).toLowerCase().includes(q));$('customerList').innerHTML=a.map(p=>`<div class="item row-item"><div><strong>${esc(p.name)}</strong><div class="muted">${esc(p.phone||t('no_phone'))}</div><span class="badge ${hasBalance(p.id)?'':'green'}">${hasBalance(p.id)?t('has_balance'):t('settled')}</span></div><div style="text-align:end"><b class="amount">${balanceSummary(p.id)}</b><div style="margin-top:7px"><button class="btn small light" onclick="details('${p.id}')">${t('details')}</button> <button class="btn small soft" onclick="editPerson('${p.id}')">${t('edit_name')}</button> <button class="btn small red" onclick="deletePerson('${p.id}')">${t('del')}</button></div></div></div>`).join('')||`<div class="empty">${t('no_customers_add')}</div>`}
function renderDebts(){let q=($('debtSearch')?.value||'').toLowerCase();let a=db.tx.filter(x=>x.kind==='debt'&&(person(x.person)?.name||'').toLowerCase().includes(q));$('debtList').innerHTML=[...a].reverse().map(item).join('')||`<div class="empty">${t('no_debts')}</div>`}
function openModal(title,body){$('modal').querySelector('.dialog').classList.remove('profile-page');$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function openForm(type,selectedId=''){if((type==='debt'||type==='payment')&&!db.people.length){toast(t('t_add_first'));openForm('person');return}
 if(type==='person')openModal(t('add_cust_title'),`<div class="field"><label>${t('cust_name')}</label><input id="name" placeholder="${t('full_name_ph')}"></div><div class="field"><label>${t('phone_cc')}</label><input id="phone" dir="ltr" placeholder="${t('phone_ph')}"></div><div class="actions"><button type="button" class="btn light" onclick="pickContact()">${t('pick_contact')}</button></div><div class="muted">${t('contact_hint')}</div><div class="row"><button class="btn" onclick="addPerson()">${t('save_customer')}</button></div>`);
 if(type==='debt'||type==='payment'){let debt=type==='debt';openModal(debt?t('new_debt_title'):t('pay_title'),`<div class="field"><label>${t('search_name')}</label><input id="personSearch" type="search" autocomplete="off" value="${selectedId?esc(person(selectedId)?.name||''):''}" placeholder="${t('type_name_ph')}" oninput="filterPeopleOptions()"><input id="who" type="hidden" value="${selectedId}"><div id="personSearchResults" class="list" style="margin-top:8px"></div><div id="selectedPerson" class="muted" style="margin-top:6px">${selectedId?t('selected')+esc(person(selectedId)?.name||''):''}</div></div><div class="field"><label>${t('amount')}</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="0"></div><div class="field"><label>${t('currency')}</label><select id="currency"><option value="USD">${t('cur_USD')}</option><option value="TRY">${t('cur_TRY')}</option><option value="SYP" selected>${t('cur_SYP')}</option></select></div>${debt?`<div class="field"><label>${t('due')}</label><input id="due" type="date"></div>`:''}<div class="field"><label>${t('notes')}</label><input id="note" placeholder="${t('optional')}"></div><label class="check"><input id="wa" type="checkbox" checked> ${debt?t('wa_debt'):t('wa_pay')}</label><div class="row"><button class="btn ${debt?'':'green'}" onclick="saveTx('${type}')">${t('save')}</button></div>`)}
}
function editPerson(id){let p=person(id);if(!p)return;openModal(t('edit_title'),`<div class="field"><label>${t('cust_name')}</label><input id="editName" value="${esc(p.name)}"></div><div class="field"><label>${t('phone')}</label><input id="editPhone" dir="ltr" value="${esc(p.phone||'')}"></div><div class="row"><button class="btn" onclick="savePersonEdit('${id}')">${t('save_edit')}</button></div>`)}
function savePersonEdit(id){let p=person(id);if(!p)return;let name=$('editName').value.trim();if(!name)return toast(t('t_enter_name'));p.name=name;p.phone=$('editPhone').value.trim();p.u=Date.now();save();closeModal();render();toast(t('t_edited'))}
async function pickContact(){if(!('contacts' in navigator)||!navigator.contacts?.select){toast(t('t_no_contacts'));return}try{let rows=await navigator.contacts.select(['name','tel'],{multiple:false});if(!rows.length)return;let c=rows[0];$('name').value=(c.name||[])[0]||'';$('phone').value=(c.tel||[])[0]||'';toast(t('t_contact_ok'))}catch(e){if(e.name!=='AbortError')toast(t('t_contact_fail'))}}
function addPerson(){let name=$('name').value.trim();if(!name)return toast(t('t_enter_name'));db.people.push({id:crypto.randomUUID(),name,phone:$('phone').value.trim(),u:Date.now()});save();closeModal();render();toast(t('t_saved_cust'))}
function filterPeopleOptions(){let q=($('personSearch')?.value||'').trim().toLocaleLowerCase(lang);let box=$('personSearchResults');let hidden=$('who');if(!box||!hidden)return;hidden.value='';$('selectedPerson').textContent='';if(!q){box.innerHTML=`<div class="empty">${t('type_to_search')}</div>`;return}let matches=db.people.filter(p=>(p.name||'').toLocaleLowerCase(lang).includes(q));box.innerHTML=matches.length?matches.map(p=>`<button type="button" class="item" style="width:100%" onclick="chooseTransactionPerson('${p.id}')"><strong>${esc(p.name)}</strong><span class="muted">${esc(p.phone||'')}</span></button>`).join(''):`<div class="empty">${t('no_match')}</div>`}
function chooseTransactionPerson(id){let p=person(id);if(!p)return;$('who').value=String(id);$('personSearch').value=p.name;$('personSearchResults').innerHTML='';$('selectedPerson').textContent=t('selected')+p.name}
function saveTx(type){let id=$('who').value,amount=money($('amount').value),p=person(id);if(!id)return toast(t('t_choose'));if(!p)return toast(t('t_not_found'));if(!Number.isFinite(Number($('amount').value))||cents(amount)<=0)return toast(t('t_bad_amount'));let currency=$('currency').value;if(type==='payment'&&cents(amount)>balanceCents(id,currency))return toast(t('t_over'));let x={id:crypto.randomUUID(),person:id,kind:type==='debt'?'debt':'payment',amount,currency,date:new Date().toISOString().slice(0,10),due:$('due')?.value||'',note:$('note').value.trim(),u:Date.now()};db.tx.push(x);save();let wa=$('wa').checked;closeModal();render();toast(t(type==='debt'?'t_debt_saved':'t_pay_saved',{n:p.name}));if(wa)whatsapp(p,t(type==='debt'?'wam_debt':'wam_pay',{n:p.name,a:fmt(amount,currency)}))}
function whatsapp(p,msg){let phone=(p.phone||'').replace(/\D/g,'');if(!phone){toast(t('t_no_wa_phone'));return}window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank')}
function details(id){let p=person(id);if(!p)return;let ts=txFor(id);openModal(t('profile'),`<div class="head"><div><h2 style="margin:0">${esc(p.name)}</h2><div class="muted">${esc(p.phone||t('no_phone_reg'))}</div></div><span class="badge ${hasBalance(id)?'':'green'}">${hasBalance(id)?t('has_balance'):t('settled')}</span></div><div class="grid" style="margin:14px 0"><div class="stat"><label>${t('remaining')}</label><strong>${balanceSummary(id)}</strong></div><div class="stat green"><label>${t('total_payments')}</label><strong>${['USD','TRY','SYP'].filter(c=>ts.some(x=>x.kind==='payment'&&currencyOf(x)===c)).map(c=>fmt(ts.filter(x=>x.kind==='payment'&&currencyOf(x)===c).reduce((s,x)=>s+cents(x.amount),0)/100,c)).join(' · ')||fmt(0,'SYP')}</strong></div></div><div class="actions"><button class="btn light" onclick="editPerson('${id}')">${t('edit_cust_data')}</button><button class="btn" onclick="openForm('debt','${id}')">${t('add_debt_for')}</button><button class="btn green" onclick="openForm('payment','${id}')">${t('pay_for')}</button></div><div class="panel"><h2>${esc(t('acct_move',{n:p.name}))}</h2><div class="list">${[...ts].reverse().map(item).join('')||`<div class="empty">${t('no_tx_cust')}</div>`}</div></div><div class="row"><button class="btn light" onclick="closeModal()">${t('close_profile')}</button></div>`);$('modal').querySelector('.dialog').classList.add('profile-page')}
function deletePerson(id){if(!confirm(t('confirm_del')))return;const now=Date.now();db.del.push({id,u:now},...txFor(id).map(x=>({id:x.id,u:now})));db.people=db.people.filter(p=>p.id!==id);db.tx=db.tx.filter(x=>x.person!==id);save();render();toast(t('t_deleted'))}
function exportData(){let blob=new Blob([JSON.stringify({app:'daftar',v:2,savedAt:Date.now(),data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='daftar-deyoun-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);d=d?.data||d;if(!d||!Array.isArray(d.people)||!Array.isArray(d.tx))throw 0;let ids=new Set();for(const p of d.people){if(!p||p.id==null||!String(p.name||'').trim()||ids.has(String(p.id)))throw 0;ids.add(String(p.id))}for(const x of d.tx){if(!x||x.id==null||!ids.has(String(x.person))||!['debt','payment'].includes(x.kind)||cents(x.amount)<=0)throw 0}if(!confirm(t('confirm_restore')))return;replaceWith(sanitize(d));toast(t('t_restored'))}catch{toast(t('t_bad_backup'))}};r.readAsText(f);e.target.value=''}
/* ---------- merge / restore ---------- */
const stable=x=>JSON.stringify(x,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((o,key)=>(o[key]=v[key],o),{}):v);
const byId=(a,b)=>a.id<b.id?-1:a.id>b.id?1:0;
const canon=d=>({people:[...d.people].sort(byId),tx:[...d.tx].sort(byId),del:[...d.del].sort(byId)});
function mergeDB(a,b){
 const tomb=new Map();
 for(const d of [...a.del,...b.del]){if((tomb.get(d.id)??-1)<d.u)tomb.set(d.id,d.u)}
 const pick=list=>{const m=new Map();for(const r of list){const o=m.get(r.id);if(!o||r.u>o.u)m.set(r.id,r)}return [...m.values()].filter(r=>!(tomb.has(r.id)&&tomb.get(r.id)>=r.u))};
 const people=pick([...a.people,...b.people]);const ids=new Set(people.map(p=>p.id));
 const tx=pick([...a.tx,...b.tx]).filter(x=>ids.has(x.person));
 const cut=Date.now()-180*864e5;
 return{people,tx,del:[...tomb].map(([id,u])=>({id,u})).filter(d=>d.u>cut)};
}
function replaceWith(snap){
 const now=Date.now(),kp=new Set(snap.people.map(p=>p.id)),kt=new Set(snap.tx.map(x=>x.id));
 const del=[...snap.del,...db.del];
 for(const p of db.people)if(!kp.has(p.id))del.push({id:p.id,u:now});
 for(const x of db.tx)if(!kt.has(x.id))del.push({id:x.id,u:now});
 db={people:snap.people.map(p=>({...p,u:now})),tx:snap.tx.map(x=>({...x,u:now})),del:del.filter(d=>!kp.has(d.id)&&!kt.has(d.id))};
 save();render();
}
/* ---------- sync config & state ---------- */
let cfg={provider:null,auto:'manual',every:15,keep:10,last:0,gid:'',dkey:''};
try{Object.assign(cfg,JSON.parse(localStorage.getItem(CKEY)||'{}'))}catch{}
const saveCfg=()=>{try{localStorage.setItem(CKEY,JSON.stringify(cfg))}catch{}};
let sync={state:'idle',msg:''},busy=false,picker=false,hist=null,autoT=null,intT=null,lastVis=0;
const cloudP=()=>cfg.provider==='gdrive'||cfg.provider==='dropbox';
const fmtTime=ms=>new Date(ms).toLocaleString(lang==='ar'?'ar':'en-US');
function setSync(state,msg=''){sync={state,msg};const b=$('cloudBtn');b.className='hbtn '+(state==='ok'?'ok':state==='err'?'err':state==='busy'?'busy':'');renderSync()}
/* ---------- providers ---------- */
const chk=async r=>{if(!r.ok){const m=await r.text();throw new Error(r.status+' '+m.slice(0,140))}return r.json()};
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
/* Google Drive (hidden appDataFolder) */
let gTok={t:'',e:0};
function loadGIS(){return new Promise((res,rej)=>{if(window.google?.accounts?.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>rej(new Error(t('google_blocked')));document.head.appendChild(s)})}
async function gToken(prompt){
 if(gTok.t&&Date.now()<gTok.e)return gTok.t;
 await loadGIS();
 return new Promise((res,rej)=>{
  const c=google.accounts.oauth2.initTokenClient({client_id:cfg.gid,scope:'https://www.googleapis.com/auth/drive.appdata',
   callback:r=>{if(r.error)return rej(new Error(r.error));gTok={t:r.access_token,e:Date.now()+(r.expires_in-60)*1000};res(gTok.t)},
   error_callback:e=>rej(new Error(e.type||'popup'))});
  c.requestAccessToken({prompt});
 })}
const gdrive={
 async h(){return{Authorization:'Bearer '+await gToken('')}},
 async list(){const r=await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=1000&fields='+encodeURIComponent('files(id,name,size)'),{headers:await this.h()});return (await chk(r)).files.map(f=>({id:f.id,name:f.name,size:+f.size||0}))},
 async read(id){const r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?alt=media',{headers:await this.h()});if(!r.ok)throw new Error(r.status);return r.text()},
 async write(name,text){const bd='daftar'+Math.random().toString(36).slice(2);const body=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name,parents:['appDataFolder'],mimeType:'application/json'})}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${text}\r\n--${bd}--`;const h=await this.h();h['Content-Type']='multipart/related; boundary='+bd;await chk(await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:h,body}))},
 async del(id){const r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id),{method:'DELETE',headers:await this.h()});if(!r.ok&&r.status!==404)throw new Error(r.status)}
};
/* Dropbox (app folder, OAuth PKCE) */
const dbxTok=()=>{try{return JSON.parse(localStorage.getItem(DKEY)||'null')}catch{return null}};
const dbxRedirect=()=>location.origin+location.pathname;
async function dbxStart(){const v=b64u(crypto.getRandomValues(new Uint8Array(32)));const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));sessionStorage.setItem('dbx_v',v);location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:cfg.dkey,response_type:'code',code_challenge:ch,code_challenge_method:'S256',token_access_type:'offline',redirect_uri:dbxRedirect()})}
async function dbxExchange(params){const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams(params)});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.error||r.status);return j}
async function dbxReturn(){const q=new URLSearchParams(location.search);const code=q.get('code'),v=sessionStorage.getItem('dbx_v');if(q.get('error'))history_replace();if(!code||!v)return false;history_replace();try{const j=await dbxExchange({code,grant_type:'authorization_code',code_verifier:v,client_id:cfg.dkey,redirect_uri:dbxRedirect()});sessionStorage.removeItem('dbx_v');localStorage.setItem(DKEY,JSON.stringify({a:j.access_token,r:j.refresh_token,e:Date.now()+j.expires_in*1000-60000}));cfg.provider='dropbox';saveCfg();return true}catch(e){toast(t('connect_fail',{e:e.message}));return false}}
function history_replace(){window.history.replaceState(null,'',location.pathname)}
const dropbox={
 async tok(){let k=dbxTok();if(!k)throw new Error('not signed in');if(Date.now()<k.e)return k.a;const j=await dbxExchange({grant_type:'refresh_token',refresh_token:k.r,client_id:cfg.dkey});k={a:j.access_token,r:k.r,e:Date.now()+j.expires_in*1000-60000};localStorage.setItem(DKEY,JSON.stringify(k));return k.a},
 async list(){const T=await this.tok();const j=await chk(await fetch('https://api.dropboxapi.com/2/files/list_folder',{method:'POST',headers:{Authorization:'Bearer '+T,'Content-Type':'application/json'},body:JSON.stringify({path:'',limit:2000})}));return j.entries.filter(e=>e['.tag']==='file').map(e=>({id:e.id,name:e.name,size:e.size||0}))},
 async read(id){const T=await this.tok();const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+T,'Dropbox-API-Arg':JSON.stringify({path:id})}});if(!r.ok)throw new Error(r.status);return r.text()},
 async write(name,text){const T=await this.tok();const r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{Authorization:'Bearer '+T,'Content-Type':'application/octet-stream','Dropbox-API-Arg':JSON.stringify({path:'/'+name,mode:'add',autorename:true,mute:true})},body:text});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120))},
 async del(id){const T=await this.tok();const r=await fetch('https://api.dropboxapi.com/2/files/delete_v2',{method:'POST',headers:{Authorization:'Bearer '+T,'Content-Type':'application/json'},body:JSON.stringify({path:id})});if(!r.ok&&r.status!==409)throw new Error(r.status)}
};
const prov=()=>cfg.provider==='gdrive'?gdrive:cfg.provider==='dropbox'?dropbox:null;
/* ---------- backup files ---------- */
const stamp=()=>new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
const bname=()=>`daftar-${stamp()}.json`;
const isB=n=>/^daftar-\d{8}T\d{6}Z\.json$/.test(n);
const nameDate=n=>{const m=n.match(/(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)Z/);return m?Date.UTC(m[1],m[2]-1,m[3],m[4],m[5],m[6]):0};
const listBackups=async P=>(await P.list()).filter(f=>isB(f.name)).sort((a,b)=>a.name<b.name?1:a.name>b.name?-1:0);
function parseBackup(text){const o=JSON.parse(text);const d=o?.data||o;if(!d||!Array.isArray(d.people)||!Array.isArray(d.tx))throw new Error('bad file');return sanitize(d)}
/* ---------- sync engine ---------- */
async function runSync(mode,silent){
 const P=prov();if(!P||busy)return;busy=true;setSync('busy');
 try{
  const files=await listBackups(P);let remote=null;
  if(mode==='sync'&&files.length){remote=parseBackup(await P.read(files[0].id));const m=mergeDB(db,remote);if(stable(canon(m))!==stable(canon(db))){db=m;persist();render()}}
  let uploaded=false;
  if(mode==='backup'||!remote||stable(canon(db))!==stable(canon(remote))){
   await P.write(bname(),JSON.stringify({app:'daftar',v:2,savedAt:Date.now(),data:db}));uploaded=true;
   const all=await listBackups(P);for(const f of all.slice(Math.max(1,cfg.keep)))await P.del(f.id)}
  cfg.last=Date.now();saveCfg();hist=null;busy=false;setSync('ok');
  if(!silent)toast(t(mode==='backup'?'backup_done':uploaded?'sync_done':'up_to_date'));
  if(document.querySelector('#sync.active'))loadHistory();
 }catch(e){busy=false;setSync('err',e.message);if(!silent)toast(t('s_err',{e:e.message}))}
}
function scheduleAuto(){if(cloudP()&&cfg.auto==='change'){clearTimeout(autoT);autoT=setTimeout(()=>runSync('sync',true),4000)}}
function setupInterval(){clearInterval(intT);if(cloudP()&&cfg.auto==='interval')intT=setInterval(()=>runSync('sync',true),Math.max(1,cfg.every)*60000)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cloudP()&&cfg.auto!=='manual'&&Date.now()-lastVis>30000){lastVis=Date.now();runSync('sync',true)}});
function setCfg(k,v){if(k==='keep')v=Math.min(100,Math.max(1,Math.round(v)||10));if(k==='every')v=Math.min(1440,Math.max(1,Math.round(v)||15));cfg[k]=v;saveCfg();setupInterval();renderSync(true)}
async function loadHistory(){const P=prov();if(!P)return;hist=null;renderSync(true);try{hist=await listBackups(P)}catch(e){hist=[];toast(t('s_err',{e:e.message}))}renderSync(true)}
async function restoreBackup(id){const P=prov();if(!P||!confirm(t('confirm_restore')))return;try{replaceWith(parseBackup(await P.read(id)));toast(t('restored_ok'))}catch(e){toast(t('s_err',{e:e.message}))}}
async function deleteBackup(id){const P=prov();if(!P||!confirm(t('confirm_del_backup')))return;try{await P.del(id);toast(t('backup_deleted'));loadHistory()}catch(e){toast(t('s_err',{e:e.message}))}}
async function connectProvider(id){
 if(id==='local'){cfg.provider='local';saveCfg();picker=false;renderSync(true);return}
 if(location.protocol==='file:')return toast(t('need_https'));
 if(id==='gdrive'){const v=$('gid')?.value.trim();if(!v)return toast(t('need_id'));cfg.gid=v;saveCfg();try{gTok={t:'',e:0};await gToken('select_account');cfg.provider='gdrive';saveCfg();picker=false;hist=null;renderSync(true);runSync('sync')}catch(e){toast(t('connect_fail',{e:e.message}))}}
 if(id==='dropbox'){const v=$('dkey')?.value.trim();if(!v)return toast(t('need_id'));cfg.dkey=v;saveCfg();dbxStart()}
}
function disconnect(){try{if(gTok.t&&window.google)google.accounts.oauth2.revoke(gTok.t)}catch{}gTok={t:'',e:0};localStorage.removeItem(DKEY);cfg.provider=null;saveCfg();clearTimeout(autoT);clearInterval(intT);hist=null;picker=false;setSync('idle')}
/* ---------- sync UI ---------- */
function pcard(logo,color,name,desc,pill,warn,body,btn){return `<div class="pcard ${btn===null?'dis':''}"><div class="ptop"><span class="plogo" style="background:${color}">${logo}</span><b>${name}</b><span class="pill ${warn?'warn':''}">${pill}</span></div><div class="muted">${desc}</div>${body}${btn||''}</div>`}
function pickerHTML(){
 const file=location.protocol==='file:';
 return `${file?`<div class="warnbox">${t('need_https')}</div>`:''}<h2>${t('choose_provider')}</h2><div class="pgrid">`+
 pcard('💾','#6b7280',t('prov_local'),t('prov_local_d'),t('ready'),false,'',`<button class="btn" onclick="connectProvider('local')">${t('use_local')}</button>`)+
 pcard('G','#1a73e8','Google Drive',t('prov_gdrive_d'),cfg.gid?t('ready'):t('needs_setup'),!cfg.gid,`<div class="field" style="margin:0"><label>${t('google_cid')}</label><input id="gid" dir="ltr" value="${esc(cfg.gid)}" placeholder="xxxx.apps.googleusercontent.com"></div><div class="muted">${t('g_hint')}</div><div class="code">${esc(location.origin)}</div>`,`<button class="btn" ${file?'disabled':''} onclick="connectProvider('gdrive')">${t('connect')}</button>`)+
 pcard('D','#0061ff','Dropbox',t('prov_dropbox_d'),cfg.dkey?t('ready'):t('needs_setup'),!cfg.dkey,`<div class="field" style="margin:0"><label>${t('dropbox_key')}</label><input id="dkey" dir="ltr" value="${esc(cfg.dkey)}" placeholder="App key"></div><div class="muted">${t('d_hint')}</div><div class="code">${esc(dbxRedirect())}</div>`,`<button class="btn" ${file?'disabled':''} onclick="connectProvider('dropbox')">${t('connect')}</button>`)+
 pcard('M','#d9272e','MEGA',t('prov_mega_d'),t('soon'),true,'',null)+
 `</div>${cfg.provider?`<div class="actions"><button class="btn light" onclick="picker=false;renderSync(true)">${t('cancel')}</button></div>`:''}`;
}
function renderSync(force){
 const box=$('syncBody');if(!box)return;
 if(!force&&box.contains(document.activeElement)&&document.activeElement.matches('input,select'))return;
 const P=cfg.provider,cloud=cloudP();
 if(!P||picker){box.innerHTML=pickerHTML();return}
 const names={local:t('prov_local'),gdrive:'Google Drive',dropbox:'Dropbox'};
 const dot=sync.state==='busy'?'busy':sync.state==='err'?'err':cfg.last?'ok':'';
 const st=sync.state==='busy'?t('syncing'):sync.state==='err'?t('s_err',{e:esc(sync.msg)}):cfg.last?t('last_sync',{t:fmtTime(cfg.last)}):t('never');
 let h=`<div class="panel"><div class="status"><span class="dot ${cloud?dot:'ok'}"></span><div><strong>${t('connected_to',{p:names[P]})}</strong>${cloud?`<div class="muted">${st}</div>`:''}</div></div><div class="actions">`+
  (cloud?`<button class="btn" ${busy?'disabled':''} onclick="runSync('sync')">${t('sync_now')}</button><button class="btn light" ${busy?'disabled':''} onclick="runSync('backup')">${t('backup_now')}</button>`:`<button class="btn" onclick="exportData()">${t('download_backup')}</button><label class="btn light" for="importFile">${t('restore')}</label>`)+
  `<button class="btn soft" onclick="picker=true;renderSync(true)">${t('change_provider')}</button><button class="btn red" onclick="disconnect()">${t('disconnect')}</button></div>${cloud?`<div class="muted">${t('sync_hint')}</div>`:''}</div>`;
 if(cloud){
  const opt=(v,k)=>`<option value="${v}" ${cfg.auto===v?'selected':''}>${t(k)}</option>`;
  h+=`<div class="panel"><h2>${t('schedule')}</h2><div class="frow"><div class="field"><label>${t('auto_mode')}</label><select onchange="setCfg('auto',this.value)">${opt('manual','am_manual')}${opt('open','am_open')}${opt('change','am_change')}${opt('interval','am_interval')}</select></div>${cfg.auto==='interval'?`<div class="field"><label>${t('every_min')}</label><input type="number" min="1" max="1440" value="${cfg.every}" onchange="setCfg('every',+this.value)"></div>`:''}<div class="field"><label>${t('keep_n')}</label><input type="number" min="1" max="100" value="${cfg.keep}" onchange="setCfg('keep',+this.value)"></div></div><div class="muted">${t('keep_hint')}</div></div>`;
  h+=`<div class="panel"><div class="head" style="margin-bottom:12px"><h2 style="margin:0">${t('history')}</h2><button class="btn small light" onclick="loadHistory()">${t('refresh')}</button></div><div class="list">`+
   (hist===null?`<div class="empty">${t('loading')}</div>`:hist.length?hist.map(f=>`<div class="item row-item"><div><strong>${fmtTime(nameDate(f.name))}</strong><div class="muted">${Math.max(1,Math.round(f.size/1024))} KB</div></div><div><button class="btn small light" onclick="restoreBackup('${esc(f.id)}')">${t('restore_btn')}</button> <button class="btn small red" onclick="deleteBackup('${esc(f.id)}')">${t('del')}</button></div></div>`).join(''):`<div class="empty">${t('no_backups')}</div>`)+`</div></div>`;
 }
 box.innerHTML=h;
}
/* ---------- init ---------- */
applyTheme();applyStatic();render();renderSync(true);
(async()=>{const back=await dbxReturn();setupInterval();if(back){go('sync');runSync('sync')}else if(cloudP()&&cfg.auto!=='manual')setTimeout(()=>runSync('sync',true),1200)})();
</script></body></html>
