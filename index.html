function updateAppHeight(){document.documentElement.style.setProperty('--app-height',(window.visualViewport?.height||window.innerHeight)+'px')}
updateAppHeight();window.addEventListener('resize',updateAppHeight);window.visualViewport?.addEventListener('resize',updateAppHeight);window.visualViewport?.addEventListener('scroll',updateAppHeight);

const cents=n=>{const v=Number(n);return Number.isFinite(v)?Math.round((v+Number.EPSILON)*100):0};
const money=n=>cents(n)/100;
const LOG_MAX=1000;
function sanitize(d){
 const people=(Array.isArray(d?.people)?d.people:[]).filter(p=>p&&p.id!=null&&String(p.name||'').trim()).map(p=>({...p,id:String(p.id),name:String(p.name).trim(),phone:String(p.phone||''),u:Number(p.u)||0}));
 const ids=new Set(people.map(p=>p.id));
 const tx=(Array.isArray(d?.tx)?d.tx:[]).filter(x=>x&&x.id!=null&&ids.has(String(x.person))&&['debt','payment'].includes(x.kind)&&cents(x.amount)>0).map(x=>({...x,id:String(x.id),person:String(x.person),amount:money(Math.abs(Number(x.amount))),currency:['USD','TRY','SYP'].includes(x.currency)?x.currency:'SYP',date:String(x.date||new Date().toISOString().slice(0,10)),u:Number(x.u)||0}));
 const del=(Array.isArray(d?.del)?d.del:[]).filter(x=>x&&x.id!=null).map(x=>({id:String(x.id),u:Number(x.u)||0}));
 const log=(Array.isArray(d?.log)?d.log:[]).filter(x=>x&&x.id!=null&&x.act).map(x=>({id:String(x.id),u:Number(x.u)||0,who:String(x.who||''),mail:String(x.mail||''),act:String(x.act),a:String(x.a??''),b:String(x.b??'')})).sort((p,q)=>q.u-p.u).slice(0,LOG_MAX);
 return{people,tx,del,log};
}
/* Data slots: guest (KEY), one per session (daftar_s_<id>), and the legacy per-account slot (used while signed in without a session). */
const ACCP='daftar_acct_',accKey=e=>ACCP+String(e).trim().toLowerCase(),sKey=id=>'daftar_s_'+id;
let cfg={auto:'live',every:15,keep:10,last:0,gid:'',top:'',acct:'',name:'',sid:'',sname:'',role:'',sowner:'',by:{},done:[],v:0};
try{Object.assign(cfg,JSON.parse(localStorage.getItem(CKEY)||'{}'))}catch{}
const saveCfg=()=>{try{localStorage.setItem(CKEY,JSON.stringify(cfg))}catch{}};
if(cfg.v<4){if(cfg.auto==='manual'||cfg.auto==='change')cfg.auto='live';cfg.v=4;if(cfg.provider!=='gdrive'||!cfg.acct){cfg.acct='';cfg.sid='';try{localStorage.removeItem('daftar_g_tok')}catch{}}delete cfg.provider;saveCfg()}
if(!cfg.by||typeof cfg.by!=='object')cfg.by={};if(!Array.isArray(cfg.done))cfg.done=[];
let curKey=cfg.acct?(cfg.sid?sKey(cfg.sid):accKey(cfg.acct)):KEY;
let RO=!!(cfg.acct&&cfg.sid&&cfg.role==='viewer');
const readSlot=k=>{try{return sanitize(JSON.parse(localStorage.getItem(k)||'null'))}catch{return sanitize(null)}};
let db=readSlot(curKey);
function logAct(act,a='',b=''){db.log.unshift({id:crypto.randomUUID(),u:Date.now(),who:cfg.name||'',mail:cfg.acct||'',act,a:String(a),b:String(b)});if(db.log.length>LOG_MAX)db.log.length=LOG_MAX}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const persist=()=>localStorage.setItem(curKey,JSON.stringify(db));
let dirty=false;
const save=()=>{persist();dirty=true;scheduleAuto()};
const person=id=>db.people.find(p=>String(p.id)===String(id));
const txFor=id=>db.tx.filter(x=>String(x.person)===String(id));
const symbol=c=>c==='USD'?'$':c==='TRY'?'₺':t('sym_SYP');
const currencyOf=x=>['USD','TRY','SYP'].includes(x.currency)?x.currency:'SYP';
const balanceCents=(id,currency='SYP')=>txFor(id).filter(x=>currencyOf(x)===currency).reduce((s,x)=>s+(x.kind==='debt'?Math.abs(cents(x.amount)):(x.kind==='payment'?-Math.abs(cents(x.amount)):0)),0);
const totalCents=(k,currency='SYP')=>db.tx.filter(x=>(!k||x.kind===k)&&currencyOf(x)===currency).reduce((s,x)=>s+Math.abs(cents(x.amount)),0);
const total=(k,currency='SYP')=>totalCents(k,currency)/100;
const currenciesInUse=()=>['USD','TRY','SYP'].filter(c=>db.tx.some(x=>currencyOf(x)===c));
const fmt=(n,currency='SYP')=>new Intl.NumberFormat(lang==='ar'?'ar':'en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(money(n))+' '+symbol(currency);
const formatTotals=getter=>{const a=currenciesInUse().map(c=>fmt(getter(c),c));return a.length?a.join(' · '):fmt(0,'SYP')};
const balanceSummary=id=>['USD','TRY','SYP'].filter(c=>txFor(id).some(x=>currencyOf(x)===c)).map(c=>fmt(Math.max(0,balanceCents(id,c))/100,c)).join(' · ')||fmt(0,'SYP');
const hasBalance=id=>['USD','TRY','SYP'].some(c=>balanceCents(id,c)>0);
function toast(s){let e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2800)}

function item(x){let p=person(x.person);return `<div class="item"><div><strong>${x.kind==='debt'?t('debt_on'):t('pay_from')} ${esc(p?.name||t('customer'))}</strong><div class="muted">${esc(x.date)}${x.note?' · '+esc(x.note):''}</div></div><div class="amount" style="color:${x.kind==='debt'?'var(--red)':'var(--green)'}">${x.kind==='debt'?'+':'−'} ${fmt(x.amount,currencyOf(x))}</div></div>`}

 $('recent').innerHTML=db.tx.length?[...db.tx].reverse().map(item).join(''):`<div class="empty">${t('no_tx')}</div>`;
 renderCustomers();renderDebts();

 renderHistory();renderSecurity();
 $('rDebt').textContent=formatTotals(c=>total('debt',c));$('rPaid').textContent=formatTotals(c=>total('payment',c));$('rBalance').textContent=formatTotals(c=>db.people.reduce((sum,p)=>sum+Math.max(0,balanceCents(p.id,c)),0)/100);
 $('reportPeople').innerHTML=db.people.map(p=>`<div class="item row-item"><div><strong>${esc(p.name)}</strong><div class="muted">${esc(p.phone||t('no_phone'))}</div></div><b>${balanceSummary(p.id)}</b></div>`).join('')||`<div class="empty">${t('no_customers')}</div>`;
}
function renderCustomers(){let q=($('customerSearch')?.value||'').toLowerCase();let a=db.people.filter(p=>(p.name+' '+p.phone).toLowerCase().includes(q));$('customerList').innerHTML=a.map(p=>`<div class="item row-item"><div><strong>${esc(p.name)}</strong><div class="muted">${esc(p.phone||t('no_phone'))}</div><span class="badge ${hasBalance(p.id)?'':'green'}">${hasBalance(p.id)?t('has_balance'):t('settled')}</span></div><div style="text-align:end"><b class="amount">${balanceSummary(p.id)}</b><div style="margin-top:7px"><button class="btn small light" onclick="details('${p.id}')">${t('details')}</button> <button class="btn small soft" onclick="editPerson('${p.id}')">${t('edit_name')}</button> <button class="btn small red" onclick="deletePerson('${p.id}')">${t('del')}</button></div></div></div>`).join('')||`<div class="empty">${t('no_customers_add')}</div>`}
function renderDebts(){let q=($('debtSearch')?.value||'').toLowerCase();let a=db.tx.filter(x=>x.kind==='debt'&&(person(x.person)?.name||'').toLowerCase().includes(q));$('debtList').innerHTML=[...a].reverse().map(item).join('')||`<div class="empty">${t('no_debts')}</div>`}

const stable=x=>JSON.stringify(x,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((o,key)=>(o[key]=v[key],o),{}):v);
const byId=(a,b)=>a.id<b.id?-1:a.id>b.id?1:0;
const canon=d=>({people:[...d.people].sort(byId),tx:[...d.tx].sort(byId),del:[...d.del].sort(byId),log:[...d.log].sort(byId)});
function mergeDB(a,b){
 const tomb=new Map();
 for(const d of [...a.del,...b.del]){if((tomb.get(d.id)??-1)<d.u)tomb.set(d.id,d.u)}
 const pick=list=>{const m=new Map();for(const r of list){const o=m.get(r.id);if(!o||r.u>o.u)m.set(r.id,r)}return [...m.values()].filter(r=>!(tomb.has(r.id)&&tomb.get(r.id)>=r.u))};
 const people=pick([...a.people,...b.people]);const ids=new Set(people.map(p=>p.id));
 const tx=pick([...a.tx,...b.tx]).filter(x=>ids.has(x.person));
 const cut=Date.now()-180*864e5;
 const lm=new Map();for(const x of [...a.log,...b.log])lm.set(x.id,x);
 const log=[...lm.values()].sort((p,q)=>q.u-p.u).slice(0,LOG_MAX);
 return{people,tx,del:[...tomb].map(([id,u])=>({id,u})).filter(d=>d.u>cut),log};
}
function replaceWith(snap){
 if(!guard())return;
 const now=Date.now(),kp=new Set(snap.people.map(p=>p.id)),kt=new Set(snap.tx.map(x=>x.id));
 const del=[...snap.del,...db.del];
 for(const p of db.people)if(!kp.has(p.id))del.push({id:p.id,u:now});
 for(const x of db.tx)if(!kt.has(x.id))del.push({id:x.id,u:now});
 const lm=new Map();for(const x of [...db.log,...(snap.log||[])])lm.set(x.id,x);
 db={people:snap.people.map(p=>({...p,u:now})),tx:snap.tx.map(x=>({...x,u:now})),del:del.filter(d=>!kp.has(d.id)&&!kt.has(d.id)),log:[...lm.values()].sort((p,q)=>q.u-p.u).slice(0,LOG_MAX)};
 logAct('restore',snap.people.length,snap.tx.length);
 save();render();
}

const SCOPES='https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/drive.appdata openid email profile';
/* any=true: let the user pick ANY account (sign in / switch). Otherwise the token must belong to the signed-in account. */
async function gAuth(prompt,any){
 await loadGIS();
 const r=await new Promise((res,rej)=>{
  const c=google.accounts.oauth2.initTokenClient({client_id:cfg.gid,scope:SCOPES,
   callback:r=>{if(r.error)return rej(new Error(r.error));res(r)},
   error_callback:e=>rej(new Error(e.type||'popup'))});
  const o={prompt};if(!any&&cfg.acct)o.hint=cfg.acct;
  c.requestAccessToken(o);
 });
 let em='',name='';
 try{const u=await(await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+r.access_token}})).json();em=String(u.email||'').toLowerCase();name=String(u.name||'')}catch{}
 if(!em)throw new Error(t('no_email'));
 if(!any&&cfg.acct&&em!==cfg.acct.toLowerCase())throw new Error(t('wrong_account',{a:cfg.acct}));
 return{t:r.access_token,e:Date.now()+(r.expires_in-60)*1000,em,name};
}

async function createSession(name){
 name=String(name||'').trim();if(!name)return toast(t('t_enter_name'));
 try{
  const first=!cfg.done.includes(cfg.acct);
  const s=await drive.create(name);
  let seed=sanitize(null);
  if(first){
   /* the first session adopts what was typed before signing in (guest data), the old per-account data and any old appData backup */
   seed=mergeDB(mergeDB(curKey===accKey(cfg.acct)?db:sanitize(null),readSlot(accKey(cfg.acct))),readSlot(KEY));
   try{const lg=await drive.legacy();if(lg)seed=mergeDB(seed,lg)}catch{}
   const empty=JSON.stringify(sanitize(null));
   localStorage.setItem(KEY,empty);localStorage.setItem(accKey(cfg.acct),empty);
   if(curKey===accKey(cfg.acct)||curKey===KEY)db=sanitize(null);
   cfg.done.push(cfg.acct);
  }
  localStorage.setItem(sKey(s.id),JSON.stringify(seed));
  closeModal();
  sessList=[s,...(sessList||[])];
  await openSession(s);
  logAct('session_create',name);save();
  toast(t('session_created'));
 }catch(e){toast(t('s_err',{e:e.message}))}
}

function diffCount(a,b){const k=d=>new Map([...d.people,...d.tx].map(r=>[r.id,r.u]));const A=k(a),B=k(b);let n=0;for(const[id,u]of B)if(!A.has(id)||A.get(id)!==u)n++;for(const id of A.keys())if(!B.has(id))n++;return n}
async function runSync(mode,silent,gesture){
 if(!cloudP()||busy)return;
 if(silent&&!gesture&&!gOK()){needAuth=true;setSync('auth');return}
 busy=true;dirty=false;setSync('busy');
 const sid=cfg.sid;
 try{
  try{
   const s=await drive.get(sid);
   if(s.role!==cfg.role){cfg.role=s.role;RO=s.role==='viewer';toast(t('role_changed'));render()}
   cfg.sname=s.name;cfg.sowner=s.owner;saveCfg();
  }catch(e){if(/^(403|404)/.test(e.message)){busy=false;setSync('idle');return sessionLost()}throw e}
  let files=await drive.list(sid),remote=null,pulled=0,uploaded=false;
  if(RO){                                            /* a visitor only downloads: the screen becomes exactly the owner's copy */
   if(files.length){remote=parseBackup(await drive.read(files[0].id));if(stable(canon(remote))!==stable(canon(db))){pulled=diffCount(db,remote);db=remote;persist();render()}}
  }else{
   if(mode==='sync'&&files.length){
    remote=parseBackup(await drive.read(files[0].id));
    const m=mergeDB(db,remote);
    if(stable(canon(m))!==stable(canon(db))){pulled=diffCount(db,m);db=m;persist();render()}
   }
   if(mode==='backup'||!remote||stable(canon(db))!==stable(canon(remote))){
    await drive.write(sid,bname(),JSON.stringify({app:'daftar',v:2,savedAt:Date.now(),data:db}));uploaded=true;
    files=await drive.list(sid);
    for(const f of files.slice(Math.max(1,cfg.keep)))await drive.trash(f.id);   /* trash, not delete: editors cannot delete the owner's files */
    files=files.slice(0,Math.max(1,cfg.keep));
   }
  }
  cfg.top=files[0]?.name||'';cfg.last=Date.now();saveCfg();needAuth=false;hist=null;busy=false;setSync('ok');
  if(pulled)toast(t('pulled',{n:pulled}));
  else if(!silent)toast(t(mode==='backup'?'backup_done':uploaded?'sync_done':'up_to_date'));
  if(document.querySelector('#sync.active'))loadHistory();
 }catch(e){busy=false;dirty=!RO;if(silent&&!gOK())needAuth=true;setSync(needAuth?'auth':'err',e.message);if(!silent)toast(t('s_err',{e:e.message}))}
}

/* ---------- app lock (PIN / recovery phrase / optional biometric) ---------- */
const LK='daftar_lock',LF='daftar_lock_fail',enc=new TextEncoder();
const lk=()=>{try{return JSON.parse(localStorage.getItem(LK)||'null')}catch{return null}};
const lkSave=o=>{try{o?localStorage.setItem(LK,JSON.stringify(o)):localStorage.removeItem(LK)}catch{}};
const bb64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const normPhrase=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ');
const newSalt=()=>bb64(crypto.getRandomValues(new Uint8Array(16)));
async function pbk(secret,salt){const key=await crypto.subtle.importKey('raw',enc.encode(secret),'PBKDF2',false,['deriveBits']);return bb64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:ub64(salt),iterations:100000},key,256))}
const pinOK=async p=>{const L=lk();return !!L&&await pbk(String(p),L.salt)===L.hash};
let locked=false,pinBuf='',hiddenAt=0,lockMode='pin',lockBusy=false;
const failInfo=()=>{try{return JSON.parse(localStorage.getItem(LF)||'{"n":0,"until":0}')}catch{return{n:0,until:0}}};
function lockNow(){if(!lk())return;locked=true;pinBuf='';lockMode='pin';renderLock()}
function unlockApp(){locked=false;pinBuf='';try{localStorage.removeItem(LF)}catch{}renderLock()}
function renderLock(msg){
 const L=lk(),el=$('lockScr');
 if(!locked||!L){el.style.display='none';el.innerHTML='';return}
 el.style.display='flex';
 if(lockMode==='rec'){
  el.innerHTML=`<div class="lkbox"><div class="lkt">🔑 ${t('recovery_title')}</div><p class="muted">${t('recovery_txt')}</p><div class="field"><input id="recPhrase" type="password" autocomplete="off" placeholder="${t('phrase_new_short')}"></div><div class="lkmsg">${msg||''}</div><div class="actions" style="justify-content:center"><button class="btn" onclick="doRecover()">${t('unlock')}</button><button class="btn light" onclick="lockMode='pin';renderLock()">${t('back_to_pin')}</button></div></div>`;
  return;
 }
 const dots=Array.from({length:L.len},(_,i)=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('');
 const keys=[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="lockKey('${n}')">${n}</button>`).join('')+(L.bio?`<button onclick="bioUnlock()" aria-label="${t('bio_label')}">☝</button>`:'<span></span>')+`<button onclick="lockKey('0')">0</button><button onclick="lockKey('x')">⌫</button>`;
 el.innerHTML=`<div class="lkbox"><div class="lkt">🔒 ${t('lock_title')}</div><div class="dots">${dots}</div><div class="lkmsg" id="lkmsg">${msg||''}</div><div class="keys">${keys}</div><button class="btn light" onclick="lockMode='rec';renderLock()">${t('forgot_pin')}</button></div>`;
}
async function lockKey(k){
 const L=lk();if(!locked||!L||lockBusy)return;
 if(k==='x'){pinBuf=pinBuf.slice(0,-1);return renderLock()}
 if(pinBuf.length>=L.len)return;
 pinBuf+=k;renderLock();
 if(pinBuf.length<L.len)return;
 const f=failInfo();
 if(Date.now()<f.until){pinBuf='';return renderLock(t('lock_blocked',{s:Math.ceil((f.until-Date.now())/1000)}))}
 lockBusy=true;const ok=await pinOK(pinBuf);lockBusy=false;
 if(ok)return unlockApp();
 const n=f.n+1;try{localStorage.setItem(LF,JSON.stringify({n,until:n%5===0?Date.now()+30000*(n/5):0}))}catch{}
 pinBuf='';renderLock(n%5===0?t('lock_blocked',{s:30*(n/5)}):t('lock_wrong'));
}
async function doRecover(){
 const L=lk(),v=$('recPhrase').value;if(!L)return;
 const ok=normPhrase(v).length>0&&await pbk(normPhrase(v),L.pSalt)===L.pHash;
 if(!ok)return renderLock(t('recovery_wrong'));
 lkSave(null);devLog('lock_recovery');unlockApp();toast(t('recovery_ok'));render();
}
document.addEventListener('keydown',e=>{if(locked&&lockMode==='pin'){if(/^\d$/.test(e.key))lockKey(e.key);else if(e.key==='Backspace')lockKey('x')}});
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}
 const L=lk();if(L&&hiddenAt&&!locked&&Date.now()-hiddenAt>=(L.timeout||0)*1000)lockNow();hiddenAt=0;
});
const bioAvail=async()=>{try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch{return false}};
async function bioUnlock(){
 const L=lk();if(!L?.bio)return;
 try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:ub64(L.bio)}],userVerification:'required',timeout:60000}});unlockApp()}catch{}
}
async function toggleBio(){
 const L=lk();if(!L)return;
 if(L.bio){L.bio='';lkSave(L);devLog('bio_off');return renderSecurity()}
 if(!await bioAvail())return toast(t('bio_unavailable'));
 try{
  const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:t('brand')},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'daftar',displayName:t('brand')},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
  L.bio=bb64(c.rawId);lkSave(L);devLog('bio_on');renderSecurity();
 }catch{toast(t('bio_unavailable'))}
}
function setLockTimeout(v){const L=lk();if(!L)return;L.timeout=+v;lkSave(L)}
const pwField=(id,k)=>`<div class="field"><label>${t(k)}</label><input id="${id}" type="password" autocomplete="off"></div>`;
const pinField=(id,k)=>`<div class="field"><label>${t(k)}</label><input id="${id}" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></div>`;
function lockSetup(){
 if(!window.crypto?.subtle)return toast(t('need_https'));
 openModal(t('setup_title'),pinField('pin1','pin_new')+pinField('pin2','pin_confirm')+pwField('ph1','phrase_new')+pwField('ph2','phrase_confirm')+`<div class="muted">${t('phrase_hint')}</div><div class="row"><button class="btn" onclick="doSetup()">${t('save')}</button></div>`);
}
async function doSetup(){
 const p1=$('pin1').value,p2=$('pin2').value,h1=normPhrase($('ph1').value),h2=normPhrase($('ph2').value);
 if(!/^\d{4,8}$/.test(p1))return toast(t('err_pin_len'));
 if(p1!==p2)return toast(t('err_pin_match'));
 if(h1.length<6)return toast(t('err_phrase_len'));
 if(h1!==h2)return toast(t('err_phrase_match'));
 const L={salt:newSalt(),pSalt:newSalt(),len:p1.length,timeout:60,bio:''};
 L.hash=await pbk(p1,L.salt);L.pHash=await pbk(h1,L.pSalt);
 lkSave(L);devLog('lock_on');closeModal();toast(t('lock_saved'));renderSecurity();
}
function lockChangePin(){openModal(t('change_pin'),pinField('pinC','pin_cur')+pinField('pin1','pin_new')+pinField('pin2','pin_confirm')+`<div class="row"><button class="btn" onclick="doChangePin()">${t('save')}</button></div>`)}
async function doChangePin(){
 const p1=$('pin1').value,p2=$('pin2').value;
 if(!await pinOK($('pinC').value))return toast(t('err_pin_wrong'));
 if(!/^\d{4,8}$/.test(p1))return toast(t('err_pin_len'));
 if(p1!==p2)return toast(t('err_pin_match'));
 const L=lk();L.salt=newSalt();L.len=p1.length;L.hash=await pbk(p1,L.salt);lkSave(L);devLog('pin_change');closeModal();toast(t('pin_changed'));
}
function lockChangePhrase(){openModal(t('change_phrase'),pinField('pinC','pin_cur')+pwField('ph1','phrase_new')+pwField('ph2','phrase_confirm')+`<div class="muted">${t('phrase_hint')}</div><div class="row"><button class="btn" onclick="doChangePhrase()">${t('save')}</button></div>`)}
async function doChangePhrase(){
 const h1=normPhrase($('ph1').value),h2=normPhrase($('ph2').value);
 if(!await pinOK($('pinC').value))return toast(t('err_pin_wrong'));
 if(h1.length<6)return toast(t('err_phrase_len'));
 if(h1!==h2)return toast(t('err_phrase_match'));
 const L=lk();L.pSalt=newSalt();L.pHash=await pbk(h1,L.pSalt);lkSave(L);devLog('phrase_change');closeModal();toast(t('phrase_changed'));
}
function lockRemove(){openModal(t('remove_lock'),`<p class="muted">${t('confirm_remove_lock')}</p>`+pinField('pinC','pin_cur')+`<div class="row"><button class="btn red" onclick="doRemove()">${t('remove_lock')}</button></div>`)}
async function doRemove(){
 if(!await pinOK($('pinC').value))return toast(t('err_pin_wrong'));
 lkSave(null);devLog('lock_off');closeModal();toast(t('lock_removed'));renderSecurity();
}
async function renderSecurity(){
 const box=$('secPanel');if(!box)return;
 const L=lk();let h=`<h2>🔐 ${t('sec_title')}</h2><p class="muted">${t('sec_txt')}</p><p class="muted">${t('lock_web_note')}</p>`;
 if(!L)h+=`<button class="btn" onclick="lockSetup()">${t('lock_setup')}</button>`;
 else{
  const to=[[0,'t_now'],[30,'t_30s'],[60,'t_1m'],[300,'t_5m']];
  h+=`<div class="status" style="margin-bottom:10px"><span class="dot ok"></span><strong>${t('lock_on')}</strong></div><div class="setrow"><label>${t('lock_after')}</label><select style="max-width:240px" onchange="setLockTimeout(this.value)">${to.map(([v,k])=>`<option value="${v}" ${(L.timeout||0)===v?'selected':''}>${t(k)}</option>`).join('')}</select></div>`;
  if(await bioAvail())h+=`<div class="setrow"><label>${t('bio_label')}</label><button class="btn ${L.bio?'green':'light'}" onclick="toggleBio()">${L.bio?'✓ ':''}${t('bio_label')}</button></div>`;
  h+=`<div class="actions"><button class="btn light" onclick="lockChangePin()">${t('change_pin')}</button><button class="btn light" onclick="lockChangePhrase()">${t('change_phrase')}</button><button class="btn red" onclick="lockRemove()">${t('remove_lock')}</button></div>`;
 }
 box.innerHTML=h;
}
/* ---------- init ---------- */
if(lk()){locked=true;renderLock()}
applyTheme();applyStatic();render();renderAcct();renderSync(true);
setupInterval();if(cloudP()&&cfg.auto!=='manual')setTimeout(()=>runSync('sync',true),1200);
</script></body></html>
